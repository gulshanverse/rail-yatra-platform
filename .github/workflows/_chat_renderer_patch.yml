name: Chat Renderer Patch

on:
  push:
    branches:
      - fix/chat-reliability-and-response-formatting

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Apply renderer patch
        run: python3 scripts/apply_chat_renderer_patch.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/frontend/src/app/chat/page.tsx apps/frontend/src/lib/sse.ts .github/workflows/_chat_renderer_patch.yml scripts/apply_chat_renderer_patch.py
          git diff --cached --quiet && exit 0
          git commit -m "fix(chat): harden frontend SSE parsing and Markdown rendering"
          git push
