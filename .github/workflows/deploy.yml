name: Continuous Deployment & Verification

on:
  push:
    branches: [ main, develop ]

jobs:
  validate-and-test:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter backend db:generate

      - name: Lint Codebases
        run: |
          pnpm --filter backend lint
          pnpm --filter frontend lint

      - name: Run Backend Unit Tests
        run: pnpm --filter backend test

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'apps/ai-service/requirements.txt'

      - name: Install AI Dependencies
        run: |
          cd apps/ai-service
          pip install -r requirements.txt
          pip install pytest ruff==0.15.21

      - name: Lint AI Service
        run: |
          cd apps/ai-service
          ruff check .

      - name: Run AI Service Tests
        run: |
          cd apps/ai-service
          PYTHONPATH=. pytest

      - name: Verify Production Backend
        env:
          BACKEND_URL: https://rail-yatra-backend.onrender.com
        run: |
          set -euo pipefail
          echo "Checking backend liveness at ${BACKEND_URL}/api/health/live"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "${BACKEND_URL}/api/health/live"; then
              echo
              echo "Backend production health check passed."
              exit 0
            fi
            echo "Backend not ready yet (attempt ${attempt}/12); waiting 10s..."
            sleep 10
          done
          echo "Backend production health check failed."
          exit 1

      - name: Verify Production AI Service
        env:
          AI_URL: https://railyatra-ai-service.onrender.com
        run: |
          set -euo pipefail
          echo "Checking AI service health at ${AI_URL}/health"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --max-time 10 "${AI_URL}/health"; then
              echo
              echo "AI service production health check passed."
              exit 0
            fi
            echo "AI service not ready yet (attempt ${attempt}/12); waiting 10s..."
            sleep 10
          done
          echo "AI service production health check failed."
          exit 1
